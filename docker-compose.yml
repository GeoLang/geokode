services:
  geokode-index:
    build: .
    profiles: ["index"]
    volumes:
      - ./data:/data
    command: ["build", "--pbf", "/data/region.osm.pbf", "--out", "/data/index"]

  geokode:
    build: .
    command: ["serve", "--index", "/data/index", "--bind", "0.0.0.0:3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data:ro
    environment:
      - RUST_LOG=info,geokode=debug
      - GEOKODE_JWT_SECRET=change-me-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
