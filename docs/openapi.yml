openapi: 3.0.3
info:
  title: Geokode API
  description: >
    Self-hosted geocoding service: forward, reverse, autocomplete and batch geocoding.
    When GEOKODE_JWT_SECRET is set, every endpoint except /health, /healthz, /readyz and /metrics
    requires an HS256 bearer JWT with sub, exp and role claims, and answers 401 without one.
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: TileTopia
    email: tiletopia@proton.me

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /forward:
    get:
      summary: Forward geocode
      description: >
        Convert a text query to coordinates. Exact and prefix hits have no result limit,
        so a short query can return every matching record. With no index hit, a fuzzy
        fallback returns at most 5 results. When the whole query matches nothing, the
        part before the first comma is searched instead, results whose state or country
        contradicts the dropped parts are removed, and confidence is capped at 0.6.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Address query string
      responses:
        '200':
          description: Geocoding results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /reverse:
    get:
      summary: Reverse geocode
      description: >
        Find the nearest addresses to a coordinate. Returns no results outside the data
        coverage, which is the OSM PBF header bbox when present, otherwise the address
        extent padded by the widest gap between neighbouring addresses. Places are never returned.
      parameters:
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Longitude
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Latitude
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of results
      responses:
        '200':
          description: Nearest addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /autocomplete:
    get:
      summary: Autocomplete
      description: >
        Prefix-based address search for interactive UIs.
        When both lon and lat are given, only the first limit * 8 matches are reranked by distance.
        Every result reports match_type exact.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Partial address prefix
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of results
        - name: lon
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Bias longitude, requires lat
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Bias latitude, requires lon
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /batch:
    post:
      summary: Batch forward geocode
      description: >
        Geocode multiple addresses in a single request.
        Each query runs through /forward in turn, with no cap on request size or per-query results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  items:
                    type: string
                  description: Array of address query strings
              required:
                - queries
      responses:
        '200':
          description: Batch geocoding results, one result list per query
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/GeoResult'
                required:
                  - results

  /health:
    get:
      summary: Health check
      description: Returns service health and record count.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  records:
                    type: integer
                    example: 25000

  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is running
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Index is loaded
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Index is empty
          content:
            text/plain:
              schema:
                type: string
                example: not ready

  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GeoResult'
      required:
        - results

    GeoResult:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        lat:
          type: number
          format: double
          description: Latitude (WGS84)
        lon:
          type: number
          format: double
          description: Longitude (WGS84)
        confidence:
          type: number
          format: double
          description: Match confidence score (0.0 to 1.0)
        match_type:
          type: string
          enum: [exact, prefix, fuzzy]
          description: >
            exact when the query is a whole indexed key, prefix when it only starts one,
            fuzzy for the typo-tolerant fallback
        kind:
          type: string
          enum: [address, place]
          description: place for an OSM settlement or administrative area
      required:
        - address
        - lat
        - lon
        - confidence
        - match_type
        - kind

    Address:
      type: object
      description: >
        Address components. Comma-split input fills them by part count. For a place, city holds the place name.
      properties:
        house_number:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        full:
          type: string
          description: Original full address string
      required:
        - full
