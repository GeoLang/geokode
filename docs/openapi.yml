openapi: 3.0.3
info:
  title: Geokode API
  description: >
    Self-hosted geocoding over an index that `geokode build` writes from an OSM PBF and optional
    address files. Results carry the OSM type and id, so callers fetch outlines from Overpass.
    Any invalid parameter or body answers 400 with {"error": "<sentence>"}.
    When GEOKODE_JWT_SECRET is set, every endpoint except /health, /healthz, /readyz and /metrics
    requires an HS256 bearer JWT with sub, exp and role claims, and answers 401 without one.
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: TileTopia
    email: tiletopia@proton.me

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /forward:
    get:
      summary: Forward geocode
      description: >
        Text to places, streets, POIs, boundaries and addresses, best first. Parts after a comma
        filter by containing area ("Paris, France"). With no exact hit, typo matches join the
        prefix matches.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BiasLat'
        - $ref: '#/components/parameters/BiasLon'
      responses:
        '200':
          $ref: '#/components/responses/Results'
        '400':
          $ref: '#/components/responses/BadRequest'

  /autocomplete:
    get:
      summary: Autocomplete
      description: The same search as /forward without the typo fallback, for type-ahead.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BiasLat'
        - $ref: '#/components/parameters/BiasLon'
      responses:
        '200':
          $ref: '#/components/responses/Results'
        '400':
          $ref: '#/components/responses/BadRequest'

  /reverse:
    get:
      summary: Reverse geocode
      description: >
        Inside the coverage of an address input, the nearest addresses. Elsewhere, the nearest
        settlements within 25 km, or nothing.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Results'
        '400':
          $ref: '#/components/responses/BadRequest'

  /batch:
    post:
      summary: Batch forward geocode
      description: Runs /forward for each query. Bodies over 64 KiB answer 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 1
              required:
                - queries
      responses:
        '200':
          description: One result list per query, in query order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/GeoResult'
                required:
                  - results
        '400':
          $ref: '#/components/responses/BadRequest'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health and record count
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  records:
                    type: integer
                    example: 544463

  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is running
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Index holds records
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Index is empty
          content:
            text/plain:
              schema:
                type: string
                example: not ready

  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    Query:
      name: q
      in: query
      required: true
      description: 1 to 256 characters after trimming
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 5
    BiasLat:
      name: lat
      in: query
      required: false
      description: Bias latitude, give lon too. Nearer results rank higher.
      schema:
        type: number
        minimum: -90
        maximum: 90
    BiasLon:
      name: lon
      in: query
      required: false
      description: Bias longitude, give lat too.
      schema:
        type: number
        minimum: -180
        maximum: 180

  responses:
    Results:
      description: At most limit results, best first
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/GeoResult'
            required:
              - results
    BadRequest:
      description: A parameter or body broke a cap
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: The limit must be between 1 and 50.
            required:
              - error

  schemas:
    GeoResult:
      type: object
      description: Every field is present, null where unknown.
      properties:
        name:
          type: string
          nullable: true
          description: The object's own name, null for a bare address
        display_name:
          type: string
          example: Musée Océanographique, Monaco
          description: Name or house number and street, then city, state, country, repeats dropped
        address:
          $ref: '#/components/schemas/Address'
        country_code:
          type: string
          nullable: true
          example: mc
          description: ISO 3166-1 alpha-2, lowercase
        lat:
          type: number
          description: A point on or inside the object
        lon:
          type: number
        bbox:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: min_lon, min_lat, max_lon, max_lat. Null for nodes and address points.
        kind:
          type: string
          enum: [address, place, street, poi, boundary]
        osm_type:
          type: string
          nullable: true
          enum: [node, way, relation]
          description: Null for CSV and GeoJSON addresses
        osm_id:
          type: integer
          format: int64
          nullable: true
        osm_key:
          type: string
          nullable: true
          example: tourism
          description: The tag key that classified the object, null for addresses
        osm_value:
          type: string
          nullable: true
          example: museum
        admin_level:
          type: integer
          nullable: true
          description: Set for kind boundary
        population:
          type: integer
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 1 for exact and prefix hits, the edit similarity for typos, at most 0.6 when a comma part could not be checked
        match_type:
          type: string
          enum: [exact, prefix, fuzzy]
      required: [name, display_name, address, country_code, lat, lon, bbox, kind, osm_type, osm_id, osm_key, osm_value, admin_level, population, confidence, match_type]

    Address:
      type: object
      description: City, state and country come from the containing admin boundaries.
      properties:
        house_number:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        full:
          type: string
          description: The input's own address text for CSV and GeoJSON, display_name otherwise
      required: [house_number, street, city, state, postcode, country, full]
