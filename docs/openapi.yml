openapi: 3.0.3
info:
  title: Geokode API
  description: Self-hosted geocoding service — forward, reverse, autocomplete, and batch geocoding.
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: TileTopia
    email: tiletopia@proton.me

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /forward:
    get:
      summary: Forward geocode
      description: >
        Convert a text address query to geographic coordinates.
        There is no result limit: a short query can return every matching record.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Address query string
      responses:
        '200':
          description: Geocoding results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /reverse:
    get:
      summary: Reverse geocode
      description: Find the nearest addresses to a geographic coordinate.
      parameters:
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Longitude
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Latitude
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of results
      responses:
        '200':
          description: Nearest addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /autocomplete:
    get:
      summary: Autocomplete
      description: >
        Prefix-based address search for interactive UIs.
        When both lon and lat are given, only the first limit * 8 matches are reranked by distance.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Partial address prefix
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of results
        - name: lon
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Bias longitude, requires lat
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Bias latitude, requires lon
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /batch:
    post:
      summary: Batch forward geocode
      description: >
        Geocode multiple addresses in a single request.
        Queries run sequentially with no cap on request size or per-query results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queries:
                  type: array
                  items:
                    type: string
                  description: Array of address query strings
              required:
                - queries
      responses:
        '200':
          description: Batch geocoding results, one result list per query
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/GeoResult'
                required:
                  - results

  /health:
    get:
      summary: Health check
      description: Returns service health and record count.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  records:
                    type: integer
                    example: 25000

  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is running
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Index is loaded
          content:
            text/plain:
              schema:
                type: string
                example: ready
        '503':
          description: Index is empty
          content:
            text/plain:
              schema:
                type: string
                example: not ready

  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GeoResult'
      required:
        - results

    GeoResult:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        lat:
          type: number
          format: double
          description: Latitude (WGS84)
        lon:
          type: number
          format: double
          description: Longitude (WGS84)
        confidence:
          type: number
          format: double
          description: Match confidence score (0.0 to 1.0)
        match_type:
          type: string
          enum: [exact, fuzzy]
          description: exact/prefix index hit, or typo-tolerant fuzzy fallback
      required:
        - address
        - lat
        - lon
        - confidence
        - match_type

    Address:
      type: object
      description: Comma-split components, filled according to how many parts the address has.
      properties:
        house_number:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        full:
          type: string
          description: Original full address string
      required:
        - full
